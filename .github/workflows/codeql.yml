# CodeQL static analysis of the loader.  Its own workflow, apart from CI: it
# is slower, and its findings land in the repository's Security tab rather
# than failing a build.
#
# Build mode "none" for now: the repository starts without a build system,
# and CodeQL can extract C/C++ source without compiling it.  Once a meson
# build exists, switch to build-mode "manual" and compile the loader target
# (see webm-pixbuf-loader's workflow), so that CodeQL sees the code as built,
# with gdk-pixbuf's and ThorVG's headers.  The sample files and the test
# driver are not analysed (.github/codeql/config.yml).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          config-file: ./.github/codeql/config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
